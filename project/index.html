<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Интро и шапка (логотип) остаются как были, для краткости опущены -->
  <div class="app">
    <!-- Левая колонка: Плеер -->
    <section class="deck">...</section>
    <!-- Правая колонка: Поиск, Авторизация, Плейлист -->
    <section class="panel">
      <!-- Статус авторизации -->
      <div id="auth-section">
        <button id="login-btn">Войти</button>
        <span id="user-email"></span>
        <button id="logout-btn" style="display:none;">Выйти</button>
      </div>
      
      <!-- Поиск в Audius -->
      <div class="search-section">
        <label>Поиск в <em>Audius</em></label>
        <div class="search-row">
          <input type="search" id="web-search-input" placeholder="Исполнитель или трек...">
          <button id="web-search-btn">Найти</button>
        </div>
        <div id="web-results"></div>
      </div>
      
      <!-- Пользовательский плейлист -->
      <div class="panel-head">
        <h2>Мой плейлист</h2>
      </div>
      <ul id="user-playlist"></ul>
    </section>
  </div>

  <!-- Модальное окно для входа/регистрации -->
  <div id="auth-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Вход / Регистрация</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Пароль">
      <button id="sign-in-btn">Войти</button>
      <button id="sign-up-btn">Зарегистрироваться</button>
      <button id="close-modal">Закрыть</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
